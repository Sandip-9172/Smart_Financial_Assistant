<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            height:100vh;

            background:linear-gradient(
                to right,
                #0f172a,
                #1e40af
            );

            display:flex;
            justify-content:center;
            align-items:center}

        .container{

            width:400px;

            background:white;

            padding:40px;

            border-radius:15px;

            box-shadow:0 10px 25px rgba(0,0,0,0.2);

        }

        .container h1{

            text-align:center;

            margin-bottom:30px;

            color:#1e293b;

        }

        .input-box{

            width:100%;

            padding:15px;

            margin-bottom:20px;

            border:1px solid #cbd5e1;

            border-radius:8px;

            font-size:16px;

        }

        .btn{

            width:100%;

            padding:15px;

            border:none;

            background:#2563eb;

            color:white;

            font-size:18px;

            border-radius:8px;

            cursor:pointer;

            transition:0.3s;

        }

        .btn:hover{

            background:#1d4ed8;

        }

        .bottom-text{

            text-align:center;

            margin-top:20px;

        }

        .bottom-text a{

            text-decoration:none;

            color:#2563eb;

            font-weight:bold;

        }

        .error{

            color:red;

            text-align:center;

            margin-bottom:15px;

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>User Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="username" placeholder="Enter Username" class="input-box" required>

            <input type="password" name="password" placeholder="Enter Password" class="input-box" required>

            <button type="submit" class="btn"> Login </button>

        </form>

        <div class="bottom-text">
            Don't have an account?
            <a href="/register/"> Register </a>
        </div>

    </div>

</body>
</html>
